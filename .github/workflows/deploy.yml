name: Build and Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: dotnet publish -c Release -o ./publish

      - name: Deploy to server and restart API
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/key
          chmod 600 ~/.ssh/key
          rsync -avz --delete -e "ssh -i ~/.ssh/key -o StrictHostKeyChecking=no" publish/ ${SERVER_USER}@${SERVER_HOST}:/var/www/backend/publish/
          ssh -i ~/.ssh/key -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} /root/deploy-api.sh
