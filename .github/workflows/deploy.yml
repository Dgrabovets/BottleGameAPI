name: Build and Deploy API

# Deploying is switched off: the workflow runs only when started by hand (Actions -> Build and Deploy API -> Run workflow).
# To deploy on every merge again, add back "push: branches: [main]" under "on:".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Publish API
        run: dotnet publish BottleGame.API/BottleGame.API.csproj -c Release -o ./publish

      - name: Create appsettings.Production.json from secrets
        env:
          POSTGRES_CONNECTION: ${{ secrets.CONNECTIONSTRING }}
          JWT_KEY: ${{ secrets.JWTKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
          PASSWORD_HASH_SECRET: ${{ secrets.PASSWORDHASHSECRETKEY }}
          PROCESSING_MODE: ${{ vars.PROCESSING_MODE || 'Simulated' }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          YOOKASSA_PAYOUT_AGENT_ID: ${{ secrets.YOOKASSA_PAYOUT_AGENT_ID }}
          YOOKASSA_PAYOUT_SECRET_KEY: ${{ secrets.YOOKASSA_PAYOUT_SECRET_KEY }}
          YOOKASSA_RETURN_URL: ${{ secrets.YOOKASSA_RETURN_URL }}
          API_ALLOWED_ORIGINS: ${{ secrets.API_ALLOWED_ORIGINS }}
          TELEGRAM_APP_NAME: ${{ secrets.TELEGRAM_APP_NAME }}
          API_LISTEN_URL: ${{ secrets.API_LISTEN_URL }}
          API_CERT_PATH: ${{ secrets.API_CERT_PATH }}
          API_CERT_KEY_PATH: ${{ secrets.API_CERT_KEY_PATH }}
        run: |
          jq -n \
            --arg conn "$POSTGRES_CONNECTION" \
            --arg jwtKey "$JWT_KEY" \
            --arg telegram "$TELEGRAM_BOT_TOKEN" \
            --arg pwdSecret "$PASSWORD_HASH_SECRET" \
            --arg mode "$PROCESSING_MODE" \
            --arg shopId "$YOOKASSA_SHOP_ID" \
            --arg secretKey "$YOOKASSA_SECRET_KEY" \
            --arg payoutAgentId "$YOOKASSA_PAYOUT_AGENT_ID" \
            --arg payoutSecretKey "$YOOKASSA_PAYOUT_SECRET_KEY" \
            --arg returnUrl "$YOOKASSA_RETURN_URL" \
            --arg origins "$API_ALLOWED_ORIGINS" \
            --arg appName "$TELEGRAM_APP_NAME" \
            --arg listenUrl "$API_LISTEN_URL" \
            --arg certPath "$API_CERT_PATH" \
            --arg certKeyPath "$API_CERT_KEY_PATH" \
            '{
              ConnectionStrings: { PostgresConnection: $conn },
              JWT: { Key: $jwtKey, Issuer: "BottleAppAPI", Audience: "BottleGame", ExpireMinutes: 360 },
              TelegramBotToken: $telegram,
              Security: { PasswordHashSecretKey: $pwdSecret },
              Processing: {
                Mode: $mode,
                ShopId: $shopId,
                SecretKey: $secretKey,
                PayoutAgentId: $payoutAgentId,
                PayoutSecretKey: $payoutSecretKey,
                ReturnUrl: $returnUrl
              },
              AppName: $appName,
              CORS: { AllowedOrigins: ($origins | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) }
            } + (if $certPath == "" then {} else {
              Kestrel: { Endpoints: { Https: {
                Url: (if $listenUrl == "" then "https://0.0.0.0:6001" else $listenUrl end),
                Certificate: { Path: $certPath, KeyPath: $certKeyPath }
              } } }
            } end)' > publish/appsettings.Production.json
      - name: Check required secrets are set
        run: |
          KEY_LEN=$(jq -r '.JWT.Key | length' publish/appsettings.Production.json)
          if [ "$KEY_LEN" -lt 32 ]; then
            echo "::error::JWT_KEY secret is empty or too short (min 32 chars). Set it in Settings → Secrets → Actions."
            exit 1
          fi
          TELEGRAM_TOKEN_OK=$(jq -r '.TelegramBotToken | if length == 0 or (ascii_downcase | startswith("env_")) or (ascii_downcase | startswith("local-development")) then "no" else "yes" end' publish/appsettings.Production.json)
          if [ "$TELEGRAM_TOKEN_OK" != "yes" ]; then
            echo "::error::TelegramBotToken is empty or a placeholder. Set the TELEGRAMBOTTOKEN secret in Settings → Secrets → Actions."
            exit 1
          fi
          PWD_LEN=$(jq -r '.Security.PasswordHashSecretKey | length' publish/appsettings.Production.json)
          if [ "$PWD_LEN" -eq 0 ]; then
            echo "::error::PASSWORD_HASH_SECRET is empty. Set it in Settings → Secrets → Actions."
            exit 1
          fi
          ORIGINS=$(jq -r '.CORS.AllowedOrigins | length' publish/appsettings.Production.json)
          if [ "$ORIGINS" -eq 0 ]; then
            echo "::error::API_ALLOWED_ORIGINS secret is empty. Set a comma-separated list of allowed browser origins."
            exit 1
          fi
          echo "Secrets check OK."
      - name: Deploy to server and restart API
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_SCRIPT" ]; then
            echo "::error::DEPLOY_PATH and DEPLOY_SCRIPT secrets must be set (target directory and restart script on the server)."
            exit 1
          fi
          mkdir -p ~/.ssh
          if echo "$SSH_PRIVATE_KEY" | grep -q "BEGIN "; then
            echo "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' > ~/.ssh/key
          else
            echo "$SSH_PRIVATE_KEY" | tr -d '\n' | base64 -d > ~/.ssh/key
          fi
          chmod 600 ~/.ssh/key
          # Pin the server host key: put the output of "ssh-keyscan <host>" into the SSH_KNOWN_HOSTS secret
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set, so the server host key is not verified. Add the secret to protect the deploy from a man in the middle."
            SSH_OPTS="-o StrictHostKeyChecking=no"
          fi
          rsync -avz --delete -e "ssh -i ~/.ssh/key $SSH_OPTS" publish/ ${SERVER_USER}@${SERVER_HOST}:"${DEPLOY_PATH}"/
          ssh -i ~/.ssh/key $SSH_OPTS ${SERVER_USER}@${SERVER_HOST} "${DEPLOY_SCRIPT}"
