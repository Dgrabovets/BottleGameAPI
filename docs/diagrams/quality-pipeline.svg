<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640">
  <title>Bottle Game API: quality pipeline</title>
  <defs>
    <style>
      .bg { fill: #000000; }
      .node { fill: #03100a; stroke: #232a25; stroke-width: 1.5; }
      .ext { fill: #000000; stroke: #a4a69f; stroke-width: 1.2; }
      .off { fill: #000000; stroke: #a4a69f; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .region { fill: none; stroke: #232a25; stroke-width: 1.5; stroke-dasharray: 4 6; }
      .bar { fill: #5fe08a; }
      .t { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 15px; fill: #f3f2ee; text-anchor: middle; }
      .s { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-weight: 400; font-size: 12.5px; fill: #a4a69f; text-anchor: middle; }
      .when { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 500; font-size: 11px; fill: #2fd4c0; text-anchor: middle; }
      .handle { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 500; font-size: 12px; letter-spacing: 4px; fill: #a4a69f; }
      .title { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 26px; fill: #f3f2ee; }
      .caption { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 500; font-size: 11px; letter-spacing: 3px; fill: #a4a69f; }
      .main { stroke: #5fe08a; stroke-width: 2; fill: none; stroke-linejoin: round; }
      .second { stroke: #2fd4c0; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; stroke-linejoin: round; }
      .manual { stroke: #a4a69f; stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; stroke-linejoin: round; }
      .pill { fill: #000000; stroke: #232a25; stroke-width: 1; }
      .l { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 500; font-size: 11px; text-anchor: middle; }
      .l-main { fill: #5fe08a; }
      .l-ref { fill: #a4a69f; }
      .legend { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 13px; fill: #a4a69f; }
    </style>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5fe08a"/></marker>
    <marker id="arrow-second" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2fd4c0"/></marker>
    <marker id="arrow-manual" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a4a69f"/></marker>
  </defs>

  <rect class="bg" width="1320" height="640" rx="16"/>

  <!-- Heading -->
  <rect class="bar" x="40" y="36" width="28" height="4" rx="2"/>
  <text class="handle" x="40" y="62">BOTTLE GAME API</text>
  <text class="title" x="40" y="98">Quality pipeline</text>

  <!-- Required checks boundary -->
  <rect class="region" x="320" y="124" width="470" height="436" rx="14"/>
  <text class="caption" x="774" y="148" text-anchor="end">REQUIRED CHECKS</text>

  <!-- Connections -->
  <path class="main" d="M150,236 V300" marker-end="url(#arrow-main)"/>
  <path class="main" d="M260,338 H320" marker-end="url(#arrow-main)"/>
  <path class="second" d="M260,486 H320" marker-end="url(#arrow-second)"/>
  <path class="main" d="M790,340 H850" marker-end="url(#arrow-main)"/>
  <path class="main" d="M1050,340 H1110" marker-end="url(#arrow-main)"/>
  <path class="manual" d="M1195,378 V456" marker-end="url(#arrow-manual)"/>

  <rect class="pill" x="109" y="258" width="82" height="20" rx="10"/>
  <text class="l l-main" x="150" y="272">weekly PRs</text>
  <rect class="pill" x="1056" y="330" width="48" height="20" rx="10"/>
  <text class="l l-main" x="1080" y="344">merge</text>
  <rect class="pill" x="1164" y="407" width="62" height="20" rx="10"/>
  <text class="l l-ref" x="1195" y="421">by hand</text>

  <!-- Sources -->
  <rect class="ext" x="40" y="136" width="220" height="100" rx="10"/>
  <text class="t" x="150" y="166">Dependabot</text>
  <text class="s" x="150" y="188">NuGet, Actions, Docker</text>
  <text class="s" x="150" y="206">weekly, on Monday</text>
  <text class="s" x="150" y="224">NuGet and Docker majors skipped</text>

  <rect class="node" x="40" y="300" width="220" height="76" rx="10"/>
  <rect class="bar" x="52" y="310" width="20" height="3" rx="1.5"/>
  <text class="t" x="150" y="334">Pull request</text>
  <text class="s" x="150" y="356">every change to main</text>

  <rect class="ext" x="40" y="448" width="220" height="76" rx="10"/>
  <text class="t" x="150" y="482">Schedule</text>
  <text class="s" x="150" y="504">Monday 06:00 UTC</text>

  <!-- Checks -->
  <rect class="node" x="345" y="164" width="420" height="84" rx="10"/>
  <rect class="bar" x="357" y="174" width="20" height="3" rx="1.5"/>
  <text class="t" x="555" y="194">build-and-test</text>
  <text class="s" x="555" y="215">ci.yml: build, unit and integration tests on PostgreSQL 17</text>
  <text class="when" x="555" y="236">pull request · push to main</text>

  <rect class="node" x="345" y="260" width="420" height="84" rx="10"/>
  <rect class="bar" x="357" y="270" width="20" height="3" rx="1.5"/>
  <text class="t" x="555" y="290">NuGet vulnerabilities</text>
  <text class="s" x="555" y="311">security.yml: direct and transitive packages</text>
  <text class="when" x="555" y="332">pull request · push to main · Monday</text>

  <rect class="node" x="345" y="356" width="420" height="84" rx="10"/>
  <rect class="bar" x="357" y="366" width="20" height="3" rx="1.5"/>
  <text class="t" x="555" y="386">New dependencies in the pull request</text>
  <text class="s" x="555" y="407">security.yml: dependency review, fails on high severity</text>
  <text class="when" x="555" y="428">pull request only</text>

  <rect class="node" x="345" y="452" width="420" height="84" rx="10"/>
  <rect class="bar" x="357" y="462" width="20" height="3" rx="1.5"/>
  <text class="t" x="555" y="482">Analyze C#</text>
  <text class="s" x="555" y="503">codeql.yml: CodeQL static analysis</text>
  <text class="when" x="555" y="524">pull request · push to main · Monday</text>

  <!-- Gate -->
  <rect class="node" x="850" y="262" width="200" height="156" rx="10"/>
  <rect class="bar" x="862" y="272" width="20" height="3" rx="1.5"/>
  <text class="t" x="950" y="298">Protect main</text>
  <text class="s" x="950" y="320">GitHub branch ruleset</text>
  <text class="s" x="950" y="348">pull request required</text>
  <text class="s" x="950" y="368">all four checks must pass</text>
  <text class="s" x="950" y="388">no force push, no deletion</text>

  <rect class="node" x="1110" y="302" width="170" height="76" rx="10"/>
  <rect class="bar" x="1122" y="312" width="20" height="3" rx="1.5"/>
  <text class="t" x="1195" y="336">main</text>
  <text class="s" x="1195" y="358">protected branch</text>

  <rect class="off" x="1110" y="456" width="170" height="84" rx="10"/>
  <text class="t" x="1195" y="486">deploy.yml</text>
  <text class="s" x="1195" y="508">manual only,</text>
  <text class="s" x="1195" y="526">runs ci.yml first</text>

  <!-- Legend -->
  <path class="main" d="M40,600 H76"/>
  <text class="legend" x="86" y="604">every change</text>
  <path class="second" d="M220,600 H256"/>
  <text class="legend" x="266" y="604">weekly run for new advisories</text>
  <path class="manual" d="M480,600 H516"/>
  <text class="legend" x="526" y="604">started by hand, automatic deployment is off</text>
</svg>
