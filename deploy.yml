# Пример: автодеплой API при push в main
# Скопируйте в ваш репозиторий с API как .github/workflows/deploy.yml
#
# В настройках репозитория GitHub (Settings → Secrets and variables → Actions) добавьте:
#   SSH_PRIVATE_KEY — приватный SSH-ключ для доступа к серверу
#   SERVER_HOST     — IP или hostname сервера
#   SERVER_USER     — пользователь (обычно root)

name: Build and Deploy API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Укажите путь к .csproj вашего API
      - name: Publish API
        run: dotnet publish -c Release -o ./publish

      - name: Deploy to server and restart API
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          rsync -avz --delete -e "ssh -i ~/.ssh/key -o StrictHostKeyChecking=no" publish/ ${SERVER_USER}@${SERVER_HOST}:/var/www/backend/publish/
          ssh -i ~/.ssh/key -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} /root/deploy-api.sh
